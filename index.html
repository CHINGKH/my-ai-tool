<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Generator Suite</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2">🤖 Smart AI Generator Tool</h1>
            <p class="text-gray-400">បង្កើតរូបភាព និងវីដេអូដោយស្វ័យប្រវត្តិតាមរយៈ Hugging Face Token តែមួយ</p>
        </header>
        <div class="bg-gray-800 p-6 rounded-lg mb-8 border border-gray-700">
            <label class="block mb-2 text-sm font-medium text-gray-300">Hugging Face Access Token (ching.ai):</label>
            <input type="password" id="hfToken" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded text-white" placeholder="ដាក់ Token របស់អ្នកនៅទីនេះ...">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4">🖼️ បង្កើតរូបភាព (AI Image)</h2>
                <textarea id="imagePrompt" rows="3" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded text-white mb-4" placeholder="ពណ៌នារូបភាពជាភាសាអង់គ្លេស..."></textarea>
                <button onclick="generateImage()" id="imgBtn" class="w-full bg-blue-600 hover:bg-blue-700 font-medium rounded p-2.5 transition">បង្កើតរូបភាព ✨</button>
                <div id="imageResult" class="mt-6 hidden">
                    <img id="outputImage" class="w-full h-auto rounded border border-gray-600" src="" alt="AI Output">
                </div>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4">🎥 បង្កើតវីដេអូ (AI Video)</h2>
                <textarea id="videoPrompt" rows="3" class="w-full p-2.5 bg-gray-700 border border-gray-600 rounded text-white mb-4" placeholder="ពណ៌នាវីដេអូជាភាសាអង់គ្លេស..."></textarea>
                <button onclick="generateVideo()" id="vidBtn" class="w-full bg-purple-600 hover:bg-purple-700 font-medium rounded p-2.5 transition">បង្កើតវីដេអូ 🚀</button>
                <div id="videoResult" class="mt-6 hidden">
                    <video id="outputVideo" controls class="w-full h-auto rounded border border-gray-600"></video>
                </div>
            </div>
        </div>
    </div>
    <script>
        // ប្រើប្រាស់សេវាកម្ម Cors-Anywhere Proxy សាធារណៈដើម្បីចៀសវាងការប្លុកតភ្ជាប់
        const proxyUrl = "https://herokuapp.com";

        async function generateImage() {
            const token = document.getElementById('hfToken').value;
            const prompt = document.getElementById('imagePrompt').value;
            if(!token || !prompt) return alert('សូមបំពេញ Token និង Prompt!');
            const btn = document.getElementById('imgBtn');
            btn.innerText = "កំពុងបង្កើតរូបភាព... ⏳";
            btn.disabled = true;
            try {
                const targetUrl = "https://huggingface.co";
                const response = await fetch(proxyUrl + targetUrl, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`, 
                        "Content-Type": "application/json",
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    body: JSON.stringify({ inputs: prompt })
                });
                if(response.ok) {
                    const blob = await response.blob();
                    document.getElementById('outputImage').src = URL.createObjectURL(blob);
                    document.getElementById('imageResult').classList.remove('hidden');
                } else { 
                    alert("ការបង្កើតរូបភាពមានកំហុស! សូមពិនិត្យមើល Token ឬសាកល្បងម្តងទៀត។"); 
                }
            } catch (e) { alert("មានបញ្ហាក្នុងការតភ្ជាប់ ឬម៉ូដែលកំពុងជាប់រវល់!"); }
            btn.innerText = "បង្កើតរូបភាព ✨";
            btn.disabled = false;
        }

        async function generateVideo() {
            const token = document.getElementById('hfToken').value;
            const prompt = document.getElementById('videoPrompt').value;
            if(!token || !prompt) return alert('សូមបំពេញ Token និង Prompt!');
            const btn = document.getElementById('vidBtn');
            btn.innerText = "កំពុងបង្កើតវីដេអូ... ⏳";
            btn.disabled = true;
            try {
                const targetUrl = "https://huggingface.co";
                const response = await fetch(proxyUrl + targetUrl, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`, 
                        "Content-Type": "application/json",
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    body: JSON.stringify({ inputs: prompt })
                });
                if(response.ok) {
                    const blob = await response.blob();
                    const videoUrl = URL.createObjectURL(blob);
                    const videoNode = document.getElementById('outputVideo');
                    videoNode.src = videoUrl;
                    document.getElementById('videoResult').classList.remove('hidden');
                    videoNode.load();
                } else { 
                    alert("ការបង្កើតវីដេអូមានកំហុស ឬម៉ូដែលកំពុងចង្អៀត!"); 
                }
            } catch (e) { alert("មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ម៉ូដែលវីដេអូ!"); }
            btn.innerText = "បង្កើតវីដេអូ 🚀";
            btn.disabled = false;
        }
    </script>
</body>
</html>
